---
layout: default
---
<main class="listing-page">
  <header class="listing-page__header">
    <div class="container is-fluid">
      <p class="page-kicker">{{ page.kicker | default: 'Portfolio' }}</p>
      <div class="columns is-variable is-7">
        <div class="column is-5"><h1>{{ page.title }}</h1></div>
        <div class="column is-7"><div class="listing-page__intro">{{ content }}</div></div>
      </div>
    </div>
  </header>

  <section class="listing-section listing-section--index">
    <div class="container is-fluid">
      <div class="masonry-grid">
        {% assign category_projects = site.projects | where: 'category', page.category | sort: 'order' %}
        {% for project in category_projects %}{% include project-card.html project=project %}{% endfor %}
      </div>
    </div>
  </section>
</main>
