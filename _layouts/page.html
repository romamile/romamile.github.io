---
layout: default
---
<main class="simple-page">
  <header class="simple-page__header">
    <div class="container is-fluid">
      <p class="page-kicker">{{ page.kicker | default: page.title }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.lead %}<p class="simple-page__lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <section class="simple-page__body">
    <div class="container is-fluid">
      <div class="columns is-variable is-7">
        <div class="column is-3"></div>
        <article class="column is-7 content project-copy">{{ content }}</article>
      </div>
    </div>
  </section>
</main>
